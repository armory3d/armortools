 Three ways it fires:
#   1. Push a version tag  ->  proper versioned release (git tag v1.0.0 && git push origin v1.0.0)
#   2. Weekly schedule    ->  automatic "nightly-YYYY-MM-DD" release (Mondays 05:00 UTC)
#   3. "Run workflow"     ->  on-demand nightly release, same naming

name: Release ArmorPaint (Windows + Fedora)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 5 * * 1'   # every Monday, 05:00 UTC

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile (Direct3D12)
        shell: pwsh
        run: |
          Set-Location paint
          ..\base\make.bat --compile

      - name: Stage portable build
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Recurse -Filter ArmorPaint.exe -File
          if (-not $exes) { throw 'ArmorPaint.exe not found - did the compile step fail?' }
          $stage = ($exes | Where-Object { Test-Path (Join-Path $_.DirectoryName 'data') } |
                    Select-Object -First 1).DirectoryName
          if (-not $stage) {
            $dataDir = Get-ChildItem -Path paint\build -Recurse -Directory -Filter data -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            if ($dataDir) {
              $stage = $dataDir.Parent.FullName
              Copy-Item $exes[0].FullName -Destination $stage -Force
            } else {
              $stage = $exes[0].DirectoryName
            }
          }
          Write-Host "Staging from: $stage"
          Compress-Archive -Path "$stage\*" -DestinationPath ArmorPaint-windows-x64.zip -Force

      - name: Pass to release job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ArmorPaint-windows-x64.zip
          retention-days: 1
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git clang make gcc gcc-c++ \
            gtk3-devel alsa-lib-devel \
            vulkan-loader-devel vulkan-headers

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile (Vulkan)
        run: |
          cd paint
          ../base/make --compile

      - name: Stage portable build
        run: |
          set -euo pipefail
          EXE=$(find . -type f -name ArmorPaint ! -path "./.git/*" | head -n 1)
          if [ -z "$EXE" ]; then echo "ArmorPaint binary not found" >&2; exit 1; fi
          STAGE=$(dirname "$EXE")
          if [ ! -d "$STAGE/data" ]; then
            DATA=$(find paint/build -type d -name data | head -n 1)
            if [ -n "$DATA" ]; then
              STAGE=$(dirname "$DATA")
              cp "$EXE" "$STAGE/"
            fi
          fi
          chmod +x "$STAGE/ArmorPaint" 2>/dev/null || true
          tar -czf armorpaint-linux-x64-fedora.tar.gz -C "$STAGE" .

      - name: Pass to release job
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: armorpaint-linux-x64-fedora.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Compute release tag
        id: rel
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=ArmorPaint $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            TAG="nightly-$(date +%Y-%m-%d)"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=ArmorPaint Nightly $TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          files: |
            dist/*
          generate_release_notes: true
